name: Compilation

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: never

jobs:
  coeur:
    name: Cœur (tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatage
        run: |
          cargo fmt --all -- --check
      - name: Analyse (clippy)
        run: outils/ci/annoter.sh cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Tests (avec la sauvegarde JSON)
        run: outils/ci/annoter.sh cargo test --workspace --all-features

  bureau-windows:
    name: Nouvelle application — Windows
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Dépendances de l'interface
        run: npm install --no-audit --no-fund
      - name: Vérification des types (TypeScript)
        run: ../outils/ci/annoter.sh npm run check
      - name: Interface (dist)
        run: npm run build
      - name: Icônes
        run: npx tauri icon src-tauri/icone-source.png
      - name: Compilation
        run: ../outils/ci/annoter.sh npx tauri build --no-bundle
      - name: Essai de bout en bout
        run: |
          export GESTION_PATHFINDER_DOSSIER="$RUNNER_TEMP/campagnes"
          export GESTION_PATHFINDER_AUTOTEST="$RUNNER_TEMP/autotest.txt"
          timeout 120 ./src-tauri/target/release/gestion-pathfinder.exe || true
          cat "$GESTION_PATHFINDER_AUTOTEST" || { echo "::error title=Essai de bout en bout::aucun rapport"; exit 1; }
          grep -q "AUTOTEST OK" "$GESTION_PATHFINDER_AUTOTEST" || { echo "::error title=Essai de bout en bout::$(tr '\n' '|' < "$GESTION_PATHFINDER_AUTOTEST")"; exit 1; }
      - name: Exécutable
        uses: actions/upload-artifact@v4
        with:
          name: gestion-pathfinder-bureau-windows
          path: desktop/src-tauri/target/release/gestion-pathfinder.exe
          if-no-files-found: error
      # Lors d'un envoi de version (étiquette v*) : publie l'exécutable sur la page « Releases ».
      - name: Publication de la version
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/src-tauri/target/release/gestion-pathfinder.exe

  # Linux : mis en pause le 23/10/2026 (Windows d'abord ; portage quand l'application sera
  # stable et terminée). Remplacer « false » par « true » pour le réactiver.
  bureau-linux:
    name: Nouvelle application — Linux
    if: ${{ false }}
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Bibliothèques système (WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - name: Dépendances de l'interface
        run: npm install --no-audit --no-fund
      - name: Vérification des types (TypeScript)
        run: ../outils/ci/annoter.sh npm run check
      - name: Interface (dist)
        run: npm run build
      - name: Icônes
        run: npx tauri icon src-tauri/icone-source.png
      - name: Compilation (AppImage)
        run: ../outils/ci/annoter.sh npx tauri build --bundles appimage
      - name: Essai de bout en bout
        run: |
          export GESTION_PATHFINDER_DOSSIER="$RUNNER_TEMP/campagnes"
          export GESTION_PATHFINDER_AUTOTEST="$RUNNER_TEMP/autotest.txt"
          xvfb-run -a timeout 120 ./src-tauri/target/release/gestion-pathfinder || true
          cat "$GESTION_PATHFINDER_AUTOTEST" || { echo "::error title=Essai de bout en bout::aucun rapport"; exit 1; }
          grep -q "AUTOTEST OK" "$GESTION_PATHFINDER_AUTOTEST" || { echo "::error title=Essai de bout en bout::$(tr '\n' '|' < "$GESTION_PATHFINDER_AUTOTEST")"; exit 1; }
      - name: AppImage
        uses: actions/upload-artifact@v4
        with:
          name: gestion-pathfinder-bureau-linux
          path: desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
