[package]
name = "combat"
description = "Mode combat : état de travail transactionnel, initiative, tours, annulation action par action, sorts, journal rejouable"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
aventure = { path = "../aventure" }
fiches = { path = "../fiches" }
temps = { path = "../temps" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["serde"]
# Les crates du moteur sont toujours compilées avec leur sérialisation (sorts, effets, sauvegarde).
serde = []
