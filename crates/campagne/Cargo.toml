[package]
name = "campagne"
description = "État d'une campagne : personnages, localités, trésoreries, transferts, journal d'événements"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
domaine = { path = "../domaine" }
regles = { path = "../regles" }
fiches = { path = "../fiches" }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
# Sauvegarde des campagnes en JSON (activée par l'application).
serde = ["dep:serde", "dep:serde_json", "domaine/serde", "regles/serde"]
