[package]
name = "vues"
description = "Modèles d'affichage de l'interface : données prêtes à montrer, calculées par le cœur"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
domaine = { path = "../domaine" }
regles = { path = "../regles" }
campagne = { path = "../campagne", features = ["serde"] }  # modèles personnels (fichier JSON)
inventaire = { path = "../inventaire" }
notes = { path = "../notes" }
fiches = { path = "../fiches" }
aventure = { path = "../aventure" }
combat = { path = "../combat" }
temps = { path = "../temps" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Sérialisation vers l'interface (activée par l'application de bureau).
serde = ["campagne/serde"]

