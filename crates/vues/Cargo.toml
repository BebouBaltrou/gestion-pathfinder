[package]
name = "vues"
description = "Modèles d'affichage de l'interface : données prêtes à montrer, calculées par le cœur"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
domaine = { path = "../domaine" }
regles = { path = "../regles" }
campagne = { path = "../campagne" }
fiches = { path = "../fiches" }
aventure = { path = "../aventure" }
combat = { path = "../combat" }
temps = { path = "../temps" }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
# Sérialisation vers l'interface (activée par l'application de bureau).
serde = ["dep:serde", "dep:serde_json", "campagne/serde"]
