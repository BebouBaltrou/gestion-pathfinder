[package]
name = "gestion-pathfinder"
description = "Gestion d'intermède Pathfinder 1 (Guide de campagne) — application de bureau (Windows, Linux)"
version = "0.2.0"
edition = "2021"
license = "MIT"

# Espace de travail séparé : l'interface dépend de crates.io (Tauri), le cœur non.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
domaine = { path = "../../crates/domaine", features = ["serde"] }
regles = { path = "../../crates/regles", features = ["serde"] }
campagne = { path = "../../crates/campagne", features = ["serde"] }
vues = { path = "../../crates/vues", features = ["serde"] }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
