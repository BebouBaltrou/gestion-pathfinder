[package]
name = "gestion-pathfinder"
description = "Gestion d'intermède Pathfinder 1 (Guide de campagne) — application de bureau (Windows, Linux)"
version = "1.2.14"
edition = "2021"
license = "MIT"

# Espace de travail séparé : l'interface dépend de crates.io (Tauri), le cœur non.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
domaine = { path = "../../crates/domaine", features = ["serde"] }
regles = { path = "../../crates/regles", features = ["serde"] }
campagne = { path = "../../crates/campagne", features = ["serde"] }
inventaire = { path = "../../crates/inventaire", features = ["serde"] }
notes = { path = "../../crates/notes", features = ["serde"] }
vues = { path = "../../crates/vues", features = ["serde"] }
fiches = { path = "../../crates/fiches" }
importation = { path = "../../crates/importation" }
aventure = { path = "../../crates/aventure" }
combat = { path = "../../crates/combat" }
temps = { path = "../../crates/temps" }
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Boîte de dialogue « enregistrer sous / ouvrir » pour l'export et l'import (déjà utilisée par l'ancienne application).
rfd = "0.15"

[profile.release]
opt-level = 3
lto = "thin"
